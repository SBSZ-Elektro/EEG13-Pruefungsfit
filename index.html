<style>
/* Farben und Schrift nach den Vorlagen „Arbeitsblatt / Leistungsnachweis SBSZ Bamberg ET“ */
:root{
 --blau:#005CA9;--blau-hell:#E8F0F9;--blau-linie:#C9D9EC;--blau-flaeche:#F2F6FB;--blau-zart:#DCE8F5;
 --gruen-logo:#94C01C;--gelb-logo:#FCCC03;
 --gruen:#2E8B22;--gruen-hell:#EAF5E6;
 --gelb-hell:#FFF7D6;
 --rot:#C62828;--rot-hell:#FDECEA;
 --grau:#6B6B6B;--grau-hell:#9A9A9A;--linie:#C8C8C8;--formel:#F3F3F3;
 --text:#1E1E1E;--bg:#F7F8FA
}
*{box-sizing:border-box}
body{margin:0;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:16px;background:var(--bg);color:var(--text);line-height:1.45}
a{color:var(--blau)}

/* Kopf wie in der Vorlage: Logo · Schulname · blaues Etikett, darunter Farbstreifen */
header{background:#fff;position:sticky;top:0;z-index:5;box-shadow:0 1px 0 var(--linie)}
.kopf{max-width:1050px;margin:0 auto;padding:10px 18px 0;display:flex;align-items:center;gap:12px}
.kopf img{height:46px;width:auto;display:block}
.kopf .schule{flex:1;min-width:0}
.kopf .schule b{display:block;color:var(--blau);font-size:17px;line-height:1.2}
.kopf .schule span{display:block;color:var(--grau);font-size:13px}
.kopf .etikett{background:var(--blau);color:#fff;text-align:center;padding:7px 18px;min-width:190px}
.kopf .etikett small{display:block;font-weight:bold;letter-spacing:.12em;font-size:12px}
.kopf .etikett span{display:block;color:var(--blau-zart);font-size:13px}
.kopf .etikett span b{color:#fff;font-size:17px}
.streifen{max-width:1050px;margin:8px auto 0;padding:0 18px}
.streifen div{height:5px;background:linear-gradient(90deg,var(--blau) 0 72%,var(--gruen-logo) 72% 90%,var(--gelb-logo) 90% 100%)}

nav{max-width:1050px;margin:0 auto;display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px}
nav button{border:1px solid var(--blau-linie);background:#fff;color:var(--text);border-radius:4px;padding:6px 13px;cursor:pointer;font:inherit;font-size:15px}
nav button:hover{background:var(--blau-flaeche)}
nav button.aktiv{background:var(--blau);color:#fff;border-color:var(--blau)}

main{max-width:1050px;margin:0 auto;padding:18px}
/* Überschriften wie „Thema“ / „Überschrift 1“ / „Abschnitt“ */
h2{color:var(--blau);margin:4px 0 12px;font-size:24px;padding-bottom:4px;border-bottom:1px solid var(--blau-linie)}
h3{margin:16px 0 8px;font-size:17px;color:var(--text)}
.karte{background:#fff;border:1px solid var(--blau-linie);border-radius:4px;padding:18px;margin-bottom:14px}

/* Kästen wie in der Vorlage */
.hinweis,.info{background:var(--blau-hell);border-left:6px solid var(--blau);padding:10px 14px;font-size:15px}
.merke{background:var(--gelb-hell);border-left:6px solid var(--gelb-logo);padding:10px 14px;margin:10px 0}
.challenge{border-left:6px solid var(--gelb-logo)}
.achtung{background:var(--rot-hell);border-left:6px solid var(--rot);padding:10px 14px}

.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.station{background:#fff;border:1px solid var(--blau-linie);border-top:4px solid var(--blau);border-radius:4px;padding:14px;cursor:pointer;position:relative;transition:transform .1s,box-shadow .1s}
.station:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,92,169,.15)}
.station.ok{border-top-color:var(--gruen-logo)}
.station .icon{font-size:30px}
.station h3{margin:6px 0 4px;color:var(--blau)}
.station p{margin:0;font-size:14px;color:var(--grau)}
.balken{height:8px;background:var(--blau-hell);overflow:hidden;margin-top:10px}
.balken div{height:100%;background:var(--gruen-logo)}
.status{font-size:13px;margin-top:6px;color:var(--grau)}
.badge{position:absolute;top:10px;right:10px;font-size:12px;padding:2px 8px;background:var(--blau-hell);color:var(--blau)}
.badge.ok{background:var(--gruen);color:#fff}

.tabs{display:flex;gap:6px;margin:6px 0 14px;flex-wrap:wrap;border-bottom:1px solid var(--blau-linie)}
.tabs button{border:none;border-bottom:3px solid transparent;background:none;padding:8px 10px;cursor:pointer;font:inherit;font-size:15px;color:var(--text);margin-bottom:-1px}
.tabs button.aktiv{border-color:var(--blau);color:var(--blau);font-weight:bold}

.btn{background:var(--blau);color:#fff;border:none;border-radius:4px;padding:9px 16px;cursor:pointer;font:inherit;font-size:15px}
.btn:hover{background:#004A8A}
.btn.zweit{background:#fff;color:var(--blau);border:1px solid var(--blau)}
.btn.zweit:hover{background:var(--blau-flaeche)}
.btn.gruen{background:var(--gruen)}
.btn:disabled{opacity:.5;cursor:default}

.flip{perspective:1000px;height:220px;margin:10px 0}
.flip .innen{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.flip.um .innen{transform:rotateY(180deg)}
.seite{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--blau-linie);border-left:6px solid var(--blau);background:var(--blau-flaeche);display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-size:19px}
.seite.rueck{transform:rotateY(180deg);background:var(--gruen-hell);border-color:var(--gruen);color:var(--gruen);font-size:17px}
.fach{display:flex;gap:8px;margin:8px 0;font-size:14px;flex-wrap:wrap}
.fach span{padding:3px 10px;background:var(--blau-hell)}

.frage{font-size:18px;margin:6px 0 10px}
.optionen label{display:block;border:1px solid var(--blau-linie);padding:9px 12px;margin:6px 0;cursor:pointer;background:#fff}
.optionen label:hover{background:var(--blau-flaeche)}
.optionen label.richtig{background:var(--gruen-hell);border-color:var(--gruen)}
.optionen label.falsch{background:var(--rot-hell);border-color:var(--rot)}
input[type=text],select{font:inherit;font-size:16px;padding:7px 9px;border:1px solid var(--grau-hell);border-radius:3px}
input[type=text]:focus,select:focus{outline:2px solid var(--blau);outline-offset:1px}
#eing,#treing{width:150px}
.feedback{margin-top:10px;padding:10px 14px;font-size:15px}
.feedback.ok{background:var(--gruen-hell);border-left:6px solid var(--gruen)}
.feedback.ok b{color:var(--gruen)}
.feedback.nein{background:var(--rot-hell);border-left:6px solid var(--rot)}
.zuord{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;max-width:640px}
.fortschritt{font-size:14px;color:var(--grau);margin-bottom:6px}

 zaehler:[
  ["Welche Anwendungsregel gilt für Zählerplätze und den Anschluss an das Niederspannungsnetz?","VDE-AR-N 4100 (TAR Niederspannung), gültig seit 01.04.2019."],
  ["Gilt die VDE-AR-N 4100 auch bei Erweiterungen?","Ja – bei Neuanlagen und bei Erweiterungen oder Änderungen bestehender Kundenanlagen."],
  ["Wofür stehen NAR und AAR?","NAR: netzseitiger Anschlussraum (vor dem Zähler, mit SLS-Schalter).<br>AAR: anlagenseitiger Anschlussraum (nach dem Zähler)."],
  ["Was ist im NAR Pflicht?","Ein 5-poliges Cu-Sammelschienensystem (L1, L2, L3, N, PE)."],
  ["Wie wird die Hauptleitung eingeführt?","Von unten, hinten oder seitlich in den NAR – oder über ein seitlich angeordnetes Einspeisegehäuse."],
  ["Was ist das RfZ?","Raum für Zusatzanwendungen im Zählerfeld: Smart-Meter-Gateway und Steuergeräte des Netzbetreibers. Die Elektrofachkraft legt Spannungsabgriff und Patchkabel zum APZ."],
  ["Was ist das APZ?","Abschlusspunkt Zählerplatz: Kommunikationsanschluss (z. B. Router des Netzbetreibers), angrenzend an Ober- oder Unterkante des Zählerschranks, mit Spannungsabgriff."],
  ["Was darf ins Verteilerfeld?","Schutzgeräte der Endstromkreise (RCD, LS, AFDD) und Reiheneinbaugeräte wie KNX-Netzteil oder Klingeltrafo."],
  ["Mindest-Kurzschlussschaltvermögen der Geräte?","NAR (SLS): 25 kA · AAR: 10 kA · Verteilerfeld: 6 kA"],
  ["Aufgaben des SLS-Schalters?","Selektiver Hauptleitungsschutz: hohes Ein-/Aus-/Kurzschlussschaltvermögen, selektiv zu nachgeschalteten LS und vorgeschalteten Sicherungen, schützt den Zähler, vom Laien bedienbar."],
  ["Wonach richtet sich die Zahl der Zählerplätze?","Wohneinheiten, Allgemeinstrom, Wärmepumpe/Speicher, Ladeeinrichtung, Erzeugungsanlage (PV), getrennte Messungen."],
  ["Wo darf kein Zählerschrank hin?","Über Treppenstufen, in Bädern/Duschen, in nicht zugänglichen oder feuchten/heißen Räumen, bei zu wenig Bedienfläche vor dem Schrank."],
  ["Vorteile des elektronischen Haushaltszählers (eHZ)?","Genauer, geringe Eigenverluste, Anzeige der aktuellen Leistung, mehrere Tarife, Fernauslesung über Smart-Meter-Gateway möglich."],
  ["Warum flexible interne Verdrahtung mit ausreichendem Querschnitt?","Zusätzliche Dauerlasten (Wallbox, Wärmepumpe) erhöhen den Strom – die Verdrahtung muss für Grund- plus Dauerlast ausgelegt sein."]
 ],
 schutz:[
  ["Aufgabe eines RCD 30 mA – und 300 mA?","30 mA: zusätzlicher Personenschutz.<br>300 mA: Brandschutz."],
  ["Wo ist ein RCD ≤ 30 mA Pflicht (VDE 0100-410)?","Steckdosenstromkreise bis 32 A für Laien und Endstromkreise für Beleuchtung in Wohnungen."],
  ["RCD Typ AC – A – F – B?","AC: nur Wechselfehlerstrom (in Deutschland nicht zulässig).<br>A: zusätzlich pulsierender Gleichfehlerstrom.<br>F: zusätzlich Mischfrequenzen (z. B. Waschmaschine mit FU).<br>B: zusätzlich glatter Gleichfehlerstrom (FU, PV, Wallbox)."],
  ["Was ist ein AFDD?","Brandschutzschalter: erkennt serielle und parallele Fehlerlichtbögen durch Auswertung von Strom- und Spannungsverlauf, meist mit integriertem LS."],
  ["Auslösemechanismen eines LS-Schalters?","Thermisch (Bimetall) bei Überlast · elektromagnetisch bei Kurzschluss."],
  ["Charakteristik B und C – magnetische Auslösung?","B: 3- bis 5-facher Bemessungsstrom · C: 5- bis 10-facher Bemessungsstrom."],
  ["Abschaltzeit im TN-System (230 V)?","Endstromkreise bis 32 A: 0,4 s · Verteilerstromkreise und über 32 A: 5 s."],
  ["Maximale Schleifenimpedanz?","Z_S ≤ U_0 / I_a (I_a = Strom, der in der geforderten Zeit sicher abschaltet, z. B. 5 · I_n bei B)."],
  ["Reihenfolge der Prüfung nach DIN VDE 0100-600?","Besichtigen – Erproben – Messen (Schutzleiter-Durchgang, Isolationswiderstand, Schleifenimpedanz, RCD, Drehfeld, Spannungsfall bei Bedarf), dann dokumentieren."],
  ["Isolationswiderstand 230/400-V-Anlage?","Messspannung 500 V DC · Grenzwert mind. 1 MΩ (SELV/PELV: 250 V, mind. 0,5 MΩ)."],
  ["Alle Stromkreise zeigen denselben niedrigen R_iso?","Wahrscheinlich wurde ein angeschlossener Überspannungsableiter mitgemessen – vor der Messung abklemmen."],
  ["Mindestmessstrom bei der Schutzleiter-Durchgangsmessung?","200 mA – mit der R_iso-Einstellung ist keine Aussage möglich."],
  ["Maximaler Erdungswiderstand im TT-System mit RCD?","R_A ≤ 50 V / I_Δn → bei 30 mA: 1667 Ω"],
  ["Wer prüft Geräte nach DIN VDE 0701-0702?","Eine Elektrofachkraft bzw. befähigte Person."],
  ["Grenzwerte Geräteprüfung (VDE 0701-0702)?","R_SL: 0,3 Ω bis 5 m Leitung, je weitere 7,5 m + 0,1 Ω, max. 1 Ω.<br>R_iso SK I: 1 MΩ (mit Heizelement 0,3 MΩ) · SK II: 2 MΩ.<br>Schutzleiterstrom 3,5 mA · Berührungsstrom 0,5 mA."],
  ["Die fünf Sicherheitsregeln?","1. Freischalten 2. Gegen Wiedereinschalten sichern 3. Spannungsfreiheit feststellen 4. Erden und kurzschließen 5. Benachbarte, unter Spannung stehende Teile abdecken."]
 ],
 leitung:[
  ["Welche Schritte gehören zur Leitungsdimensionierung?","Betriebsstrom I_b → Schutzorgan I_n → Strombelastbarkeit I_z (Verlegeart, Häufung, Temperatur) → Spannungsfall → Abschaltbedingung prüfen."],
  ["Überlastschutz-Bedingung?","I_b ≤ I_n ≤ I_z (und I_2 ≤ 1,45 · I_z)"],
  ["Warum unterscheidet man Verlegearten?","Die Wärmeabfuhr ist unterschiedlich – je schlechter die Kühlung, desto geringer die Strombelastbarkeit."],
  ["Verlegeart A1/A2?","In wärmegedämmten Wänden (A1: Aderleitungen im Rohr, A2: mehradrige Leitung im Rohr bzw. direkt in der Dämmung)."],
  ["Verlegeart B1/B2 und C?","B: im Elektroinstallationsrohr bzw. -kanal auf oder in der Wand.<br>C: direkt auf oder in der Wand (z. B. NYM unter Putz)."],
  ["Was passiert bei höherer Umgebungstemperatur?","Die Strombelastbarkeit sinkt: I_z mal Umrechnungsfaktor (z. B. PVC bei 40 °C: 0,87)."],
  ["Was bedeutet Häufung?","Mehrere belastete Leitungen nebeneinander erwärmen sich gegenseitig – Reduktionsfaktor anwenden."],
  ["Spannungsfall Wechselstrom?","ΔU = 2 · l · I · cos φ / (γ · A)"],
  ["Spannungsfall Drehstrom?","ΔU = √3 · l · I · cos φ / (γ · A)"],
  ["Empfohlener maximaler Spannungsfall vom Zähler bis zum Verbraucher?","3 % (DIN 18015-1)."],
  ["Strom eines symmetrischen Drehstromverbrauchers (cos φ = 1)?","I = P / (√3 · U) – z. B. 21 kW an 400 V: 30,3 A."],
  ["Warum braucht ein Drehstrom-Durchlauferhitzer keinen N?","Er ist symmetrisch belastet – der Strom im Sternpunkt ist null."]

 motor:[

  ["Woran erkennst du einen Asynchronmotor?","Die Läuferdrehzahl liegt etwas unter der Synchrondrehzahl (Schlupf), z. B. 2950 statt 3000 1/min."],
  ["Leistungsschild 230/400 V am 400-V-Netz?","Sternschaltung (Strangspannung 230 V)."],
  ["Leistungsschild 400/690 V am 400-V-Netz?","Dreieckschaltung – auch Stern-Dreieck-Anlauf möglich."],
  ["Was gibt die Leistungsangabe auf dem Leistungsschild an?","Die mechanisch an der Welle abgegebene Leistung P_ab."],
  ["Wirkungsgrad Motor?","η = P_ab / P_zu · P_zu = √3 · U · I · cos φ"],
  ["Auf welchen Wert stellst du den Motorschutzschalter ein?","Auf den Bemessungsstrom vom Leistungsschild (passend zur Schaltung)."],
  ["Motor brummt, läuft aber nicht an – Ursachen?","Ein Außenleiter fehlt, Brücken falsch gesteckt, Lagerschaden/Antrieb blockiert."],
  ["Drehrichtung ändern?","Zwei Außenleiter tauschen."],
  ["Übersetzungsverhältnis Trafo?","ü = U_1 / U_2 = N_1 / N_2 = I_2 / I_1"],
  ["Spartrafo – Trenntrafo – Sicherheitstrafo?","Spartrafo: keine galvanische Trennung.<br>Trenntrafo: galvanisch getrennt.<br>Sicherheitstrafo: getrennt und SELV-Ausgangsspannung."],
  ["Wozu kompensiert man Blindleistung?","Netz und Leitungen entlasten (kleinerer Strom), Blindstromkosten vermeiden."],
  ["Arten der Kompensation?","Einzel-, Gruppen- und Zentralkompensation."],
  ["Warum nicht auf cos φ = 1 kompensieren?","Gefahr von Resonanz (Schwingkreis) und Überkompensation bei Teillast."],
  ["Formeln Kompensation?","Q_C = P · (tan φ_1 − tan φ_2) · C = Q_C / (U² · 2π · f)"]

  ["Anzeige am Typ-2-Ableiter grün/rot?","Grün: funktionsfähig · Rot: Ableiter verbraucht – tauschen."],
  ["Zusätzlicher Schutzpotentialausgleich im Bad immer nötig?","Nein – nur wenn fremde leitfähige Teile nicht schon über den Schutzpotentialausgleich verbunden sind."],

 it:[

 ema:[
  ["Was regelt DIN VDE 0833 Teil 3?","Einbruch- und Überfallmeldeanlagen (EMA/ÜMA)."],
  ["Was bedeutet der Grad nach DIN EN 50131?","Einstufung von Grad 1 bis 4 nach Risiko und Täterprofil (Kenntnisse, Werkzeug)."],
  ["Welche VdS-Klasse braucht ein Juwelier?","Klasse C (Sicherungsklassen SG-3 bis SG-6)."],
  ["VdS-Klasse A und B – typische Objekte?","A: Wohnung, Einfamilienhaus (SH-1 bis SH-3).<br>B: Büro, Laden (bis SG-2)."],
  ["Nenne die vier Überwachungsarten.","Freiland-, Außenhaut-, Raum- und Objektüberwachung."],
  ["Fallenmäßig – schwerpunktmäßig?","Fallenmäßig: Bereiche, die der Täter durchqueren muss (Flur, Treppe).<br>Schwerpunktmäßig: besonders gefährdete Bereiche (Tresorraum)."],
  ["Wie funktioniert ein PIR-Melder?","Passiv: erkennt Änderungen der Wärmestrahlung, wenn sich ein warmer Körper durch mehrere Zonen bewegt."],
  ["Glasbruchmelder: passiv – aktiv – akustisch?","Passiv: Schwingungen der Scheibe (Klasse A, B).<br>Aktiv: Sender/Empfänger auf der Scheibe (Klasse C Pflicht).<br>Akustisch: Mikrofon, zweistufig."],
  ["Was bedeutet Zwangsläufigkeit?","Scharfschalten nur, wenn alle Melder in Ruhe sind und keine Störung oder Sabotage ansteht – und niemand versehentlich den scharfen Bereich betritt."],
  ["Intern scharf – extern scharf?","Intern: Personen im Objekt, Außenhaut überwacht, interner Alarm.<br>Extern: niemand im Objekt, alle Meldegruppen aktiv, externer Alarm."],
  ["Wozu dient der Sabotagekontakt?","Meldet Öffnen oder Abreißen eines Geräts – immer, auch bei unscharfer Anlage (24 h)."],
  ["Max. Melder je Meldegruppe?","Einbruchmeldegruppe 20 Melder · Sabotagemeldegruppe 10 Melder."],
  ["Montage Außensignalgeber?","Außerhalb des Handbereichs (ca. über 3 m), ohne Hilfsmittel nicht erreichbar, gut wahrnehmbar."],
  ["Wo wird die EMZ montiert?","Im Sicherungsbereich, nicht für jedermann zugänglich, von außen nicht erkennbar."],
  ["AWAG oder AWUG?","AWAG: Wähl- und Ansagegerät → Privatpersonen.<br>AWUG: Wähl- und Übertragungsgerät → Notruf- und Serviceleitstelle."],
  ["Überbrückungszeit Akku Klasse A / B und C?","A: 12 h · B/C: 60 h (30 h bei Störungsweiterleitung an ständig besetzte Stelle). Dazu 60 s akustisch + 30 min optisch."],
  ["Formel Akkukapazität EMA?","K = t · I_R + 1/60 h · ΣI_ak + 0,5 h · I_opt"]

 bma:[
  ["Schutzziele einer BMA?","Schutz von Personen, Sachwerten und Umwelt durch frühe Branderkennung und Alarmierung."],
  ["BMZ – FBF – FAT?","Brandmelderzentrale · Feuerwehr-Bedienfeld · Feuerwehr-Anzeigetableau."],
  ["FSD und FSE?","FSD: Feuerwehr-Schlüsseldepot.<br>FSE: Freischaltelement – Feuerwehr löst Alarm aus, damit das FSD öffnet."],
  ["Was zeigt die Blitzleuchte?","Den Feuerwehrzugang mit FSD, FBF und FAT."],
  ["Handfeuermelder – Hausalarm-Handmelder?","Rot, alarmiert die Feuerwehr · Blau, nur interner Alarm."],
  ["Handfeuermelder: Montagehöhe?","1,4 m ± 0,2 m, an Flucht- und Rettungswegen."],
  ["Prinzip optischer Rauchmelder?","Streulicht: Rauchpartikel streuen LED-Licht auf eine Fotodiode."],
  ["Maximal- und Differentialmelder?","Maximal: feste Temperatur (z. B. 58 °C).<br>Differential: schneller Temperaturanstieg."],
  ["Vorteil Mehrkriterienmelder?","Wertet z. B. Rauch, Wärme und CO aus → sicherere Erkennung, weniger Falschalarme."],
  ["Melder für Teeküche – Büro – hohe Halle?","Wärmemelder · optischer Rauchmelder · linienförmiger Rauchmelder oder Ansaugrauchmelder."],
  ["Was bedeuten A_M und D_H?","A_M: max. Überwachungsfläche je Melder.<br>D_H: max. Abstand vom Melder zu jedem Punkt der Decke."],
  ["Wie prüfst du das Melderraster?","Für jedes Feld: Fläche ≤ A_M und r = √((a/2)² + (b/2)²) ≤ D_H."],
  ["Nenne vier Brandfallsteuerungen.","Brandschutztüren schließen, Aufzüge in Evakuierungsebene, Lüftung aus, RWA öffnen."],
  ["Inspektion – Wartung?","Inspektion vierteljährlich · Wartung mindestens jährlich (Fachfirma)."],
  ["Wer setzt die BMA nach Feueralarm zurück?","Die Feuerwehr, nachdem sie die Ursache geprüft hat."],
  ["Akku der BMZ?","72 h Überbrückung (30 h bei Störungsweiterleitung) + 30 min Alarm: K = t · I_R + 0,5 h · I_A"],
  ["Wie funktioniert ein Ansaugrauchmelder und wo wird er eingesetzt?","Ein Lüfter saugt über ein Rohrnetz mit Ansaugöffnungen ständig Luft aus dem Raum an und prüft sie in einer Messkammer sehr empfindlich auf Rauch. Einsatz: hohe Hallen, Serverräume, Kühllager und dort, wo Melder schwer zu warten oder unsichtbar sein sollen (z. B. Museen)."],
  ["Vorteil Ringbus mit adressierbaren Meldern?","Bei Leitungsbruch fällt kein Melder aus; die BMZ zeigt genau, welcher Melder ausgelöst hat."]
 ],
 ant:[

  ["Downlink und Sat-ZF?","Downlink 10,7–12,75 GHz · Sat-ZF 950–2150 MHz."],

  ["Was bedeutet Multischalter 5/8?","5 Eingänge (4 Sat-Ebenen + 1 terrestrisch), 8 Teilnehmerausgänge."],
  ["Was ist Unicable?","Mehrere Receiver an einer Leitung – jeder Receiver bekommt ein eigenes Userband (EN 50494/50607)."],

  ["Verteiler – Abzweiger?","Verteiler: alle Ausgänge gleiche Dämpfung.<br>Abzweiger: kleiner Durchgang, hohe Abzweigdämpfung."],
  ["Wozu dient der 75-Ω-Abschlusswiderstand?","Schließt offene Ausgänge ab und verhindert Reflexionen."],
  ["Pegel in dBµV aus Spannung?","L = 20 · lg(U / 1 µV) · 60 dBµV = 1 mV."],
  ["Pegel an der Dose berechnen?","L_A = L_E + V − alle Dämpfungen (Kabel, Verteiler, Abzweiger, Dose)."],
  ["Sollpegel an der Sat-Dose?","Ca. 47–77 dBµV."],
  ["Biegemoment am Mast?","M = F · l (l ab Einspannstelle), alle Antennen addieren, mit zulässigem Moment vergleichen."],
  ["Wann muss die Antenne nicht geerdet werden?","Mind. 2 m unter Dachkante und höchstens 1,5 m von der Wand entfernt."],
  ["Mindestquerschnitte Erdung / Potentialausgleich?","Erdungsleiter 16 mm² Cu · Potentialausgleich 4 mm² Cu."],
  ["Abstand zu Freileitungen?","Bis 1000 V mind. 1 m · über 1000 V mind. 3 m."],
  ["BER und MER?","BER: Bitfehlerrate, je kleiner desto besser.<br>MER: Modulationsfehlerverhältnis in dB, je größer desto besser."]

 elek:[
  ["Anschlüsse eines NPN-Transistors?","Basis (B), Kollektor (C), Emitter (E)."],
  ["Wie steuert der Transistor?","Ein kleiner Basisstrom I_B steuert einen großen Kollektorstrom I_C: I_C = B · I_B."],
  ["U_BE eines Si-Transistors, wenn er leitet?","ca. 0,7 V."],
  ["Transistor als Schalter: EIN?","Übersteuert (gesättigt): U_CE ≈ 0,2 V, die Last bekommt fast die volle Spannung."],
  ["Transistor als Schalter: AUS?","Gesperrt: I_C ≈ 0, U_CE ≈ U_B."],
  ["Warum ein Basisvorwiderstand?","Er begrenzt den Basisstrom und schützt die Basis-Emitter-Strecke."],
  ["Formel Basisvorwiderstand?","R_B = (U_St − U_BE) / I_B"],
  ["Was ist der Übersteuerungsfaktor?","I_B wird 2- bis 5-mal größer gewählt als I_C / B – so schaltet der Transistor sicher durch."],
  ["Wozu dient die Freilaufdiode am Relais?","Sie schützt den Transistor vor der hohen Induktionsspannung beim Abschalten der Spule."],
  ["Warum braucht eine LED einen Vorwiderstand?","Sie hat kaum Eigenwiderstand – der Strom muss auf I_F begrenzt werden."],
  ["Formel Vorwiderstand?","R_V = (U_B − U_F) / I_F"],
  ["Mehrere LEDs in Reihe?","R_V = (U_B − n · U_F) / I_F"],
  ["Typische Durchlassspannungen?","Rot ca. 2 V · Grün ca. 2,2 V · Blau/Weiß ca. 3–3,2 V."],
  ["Woran erkennst du die Kathode der LED?","Kürzeres Bein, abgeflachte Seite am Gehäuse."],
  ["Welchen Widerstandswert wählst du?","Den nächstgrößeren Normwert (E12), damit der Strom nicht zu groß wird."]

/* ---------- Hilfsfunktionen ---------- */
const $ = s => document.querySelector(s);
const zahl = s => parseFloat(String(s).replace(",","."));
const de = (x,n=2) => Number(x).toLocaleString("de-DE",{maximumFractionDigits:n});
const mischen = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const zufall = (a,b,schritt=1) => Math.round((a+Math.random()*(b-a))/schritt)*schritt;
function sub(t){return t.replace(/(^|[^A-Za-z0-9])([A-Za-zΔφηεθ])_([A-Za-z0-9Δ]{1,3})(?![A-Za-z0-9])/g,"$1$2<sub>$3</sub>");}

function kartenFortschritt(id){
 const n=KARTEN[id].length; let p=0;
 KARTEN[id].forEach((_,i)=>{p+=(stand.fach[id+"-"+i]||1)-1;});
 return Math.round(p/(2*n)*100);
}

/* ---------- Karteikarten mit 3 Fächern ---------- */
function karteikarten(id){
 const liste = KARTEN[id].map((k,i)=>({i,k,fach:stand.fach[id+"-"+i]||1}));
 const offen = liste.filter(x=>x.fach<3);
 const zaehl = f=>liste.filter(x=>x.fach===f).length;
 const kopf = `<div class="fach"><span>Fach 1 (neu): ${zaehl(1)}</span><span>Fach 2 (fast): ${zaehl(2)}</span><span style="background:var(--gruen-hell)">Fach 3 (sicher): ${zaehl(3)}</span></div>`;
 if(!offen.length){
  $("#inhalt").innerHTML = kopf+`<div class="feedback ok">Alle Karten sind in Fach 3. Stark! Mach jetzt das Quiz.</div>
  <p><button class="btn zweit" onclick="kartenReset('${id}')">Karten wieder in Fach 1 legen</button></p>`; return;
 }
 offen.sort((a,b)=>a.fach-b.fach);
 const akt = offen[0];
 $("#inhalt").innerHTML = kopf+`
  <p class="klein">Klicke auf die Karte, um sie umzudrehen. Beantworte die Frage erst im Kopf oder laut.</p>
  <div class="flip" id="flip" onclick="this.classList.toggle('um')"><div class="innen">
   <div class="seite">${sub(akt.k[0])}</div><div class="seite rueck">${sub(akt.k[1])}</div></div></div>
  <button class="btn gruen" onclick="kartenWertung('${id}',${akt.i},true)">✓ Gewusst</button>
  <button class="btn zweit" onclick="kartenWertung('${id}',${akt.i},false)">✗ Nochmal</button>`;
}
function kartenWertung(id,i,ok){
 const key=id+"-"+i, f=stand.fach[key]||1;
 stand.fach[key]= ok?Math.min(3,f+1):1; sichern(); karteikarten(id);
}
function kartenReset(id){KARTEN[id].forEach((_,i)=>delete stand.fach[id+"-"+i]);sichern();karteikarten(id);}

/* ---------- Quiz ---------- */
let Q=null;
function quizStart(name,fragen,ziel,speicherId){
 Q={name,fragen:mischen(fragen),nr:0,punkte:0,ziel,speicherId,beantwortet:false,log:[]};
 quizFrage();
}
function quizFrage(){
 const f=Q.fragen[Q.nr]; Q.beantwortet=false;
 let html=`<div class="fortschritt">Frage ${Q.nr+1} von ${Q.fragen.length}</div><div class="frage">${sub(f.f)}</div>`;
 if(f.typ==="mc"){
  html+=`<div class="optionen">${f.o.map((o,i)=>`<label id="opt${i}"><input type="radio" name="mc" value="${i}"> ${sub(o)}</label>`).join("")}</div>`;
 } else if(f.typ==="mehr"){
  html+=`<p class="klein">Mehrere Antworten können richtig sein – kreuze alle richtigen an.</p><div class="optionen">${f.o.map((o,i)=>`<label id="opt${i}"><input type="checkbox" name="mehr" value="${i}"> ${sub(o)}</label>`).join("")}</div>`;
 } else if(f.typ==="zahl"){
  html+=`<input type="text" inputmode="decimal" autocomplete="off" id="eing" placeholder="Ergebnis"> ${f.einheit}`;
 } else {
  const rechts=mischen(f.p.map(x=>x[1]));
  html+=`<div class="zuord">${f.p.map((x,i)=>`<div><b>${x[0]}</b></div><select id="z${i}"><option value="">– wählen –</option>${rechts.map(r=>`<option>${r}</option>`).join("")}</select>`).join("")}</div>`;
 }
 html+=`<p><button class="btn" id="pruef" onclick="quizPruefen()">Prüfen</button></p><div id="fb"></div>`;
 document.getElementById(Q.ziel).innerHTML=html;
}
function quizPruefen(){
 if(Q.beantwortet){return;}
 const f=Q.fragen[Q.nr]; let ok=false;
 if(f.typ==="mc"){
  const w=document.querySelector('input[name=mc]:checked'); if(!w)return;
  ok=+w.value===f.r;
  document.getElementById("opt"+f.r).classList.add("richtig");
  if(!ok)document.getElementById("opt"+w.value).classList.add("falsch");
 } else if(f.typ==="mehr"){
  const gew=[...document.querySelectorAll('input[name=mehr]:checked')].map(x=>+x.value); if(!gew.length)return;
  ok = gew.length===f.r.length && f.r.every(i=>gew.includes(i));
  f.o.forEach((_,i)=>{const el=document.getElementById("opt"+i); if(f.r.includes(i))el.classList.add("richtig"); else if(gew.includes(i))el.classList.add("falsch");});
 } else if(f.typ==="zahl"){
  const v=zahl($("#eing").value); if(isNaN(v))return;
  ok = f.tol===0 ? Math.abs(v-f.l)<1e-9 : Math.abs(v-f.l)<=Math.abs(f.l)*f.tol/100+1e-9;
 } else {
  ok=f.p.every((x,i)=>$("#z"+i).value===x[1]);
 }
 Q.beantwortet=true; if(ok)Q.punkte++;
 Q.log.push({f:f.f,ok,k:f.k||(f.typ==="zahl"?"IA3":"IA1")});
 const letzte=Q.nr===Q.fragen.length-1;
 $("#fb").innerHTML=`<div class="feedback ${ok?'ok':'nein'}"><b>${ok?'Richtig!':'Noch nicht.'}</b> ${sub(f.e)}</div>
  <p><button class="btn" onclick="${letzte?'quizEnde()':'Q.nr++;quizFrage()'}">${letzte?'Auswertung':'Nächste Frage →'}</button></p>`;
 $("#pruef").disabled=true;
}
function quizEnde(){
 const pz=Math.round(Q.punkte/Q.fragen.length*100);
 if(Q.speicherId){stand.quiz[Q.speicherId]=Math.max(pz,stand.quiz[Q.speicherId]||0);sichern();}
 const falsch=Q.log.filter(x=>!x.ok);
 document.getElementById(Q.ziel).innerHTML=`
  <div class="ergebnis">${pz} % – ${pz>=80?'bestanden ✓':'noch nicht bestanden'}</div>
  <p>${Q.punkte} von ${Q.fragen.length} Fragen richtig.</p>
  ${koordTabelle()}
  ${falsch.length?`<div class="merke"><b>Das wiederholst du noch einmal:</b><ul>${falsch.map(x=>`<li>${sub(x.f)}</li>`).join("")}</ul></div>`:''}
  <button class="btn" onclick="quizStart(Q.name,Q.fragen,Q.ziel,Q.speicherId)">Quiz wiederholen</button>`;
}

const KOORD={IA1:"Wissen wiedergeben (nennen, zuordnen)",IA2:"Wissen erklären und begründen",IA3:"Wissen anwenden (berechnen, übertragen)"};
function koordTabelle(){
 const g={}; Q.log.forEach(x=>{g[x.k]=g[x.k]||[0,0];g[x.k][1]++;if(x.ok)g[x.k][0]++;});
 return `<table style="max-width:620px;margin:8px 0 12px"><tr><th>Ziel</th><th>Bereich</th><th>richtig</th><th>Stand</th></tr>${Object.keys(g).sort().map(k=>{const [a,n]=g[k],p=a/n;
  return `<tr><td>${k}</td><td>${KOORD[k]||''}</td><td>${a} / ${n}</td><td>${p>=0.8?'● sicher':(p>=0.5?'◐ teilweise':'○ noch nicht')}</td></tr>`;}).join("")}</table>`;
}

   const pzu=p*1000/eta, i=pzu/(Math.sqrt(3)*400*cos);
   return {text:`Leistungsschild eines Drehstrommotors: P = ${de(p,1)} kW, η = ${de(eta,2)}, cos φ = ${de(cos,2)}, Netz 400 V. Berechne die Stromaufnahme I in A.`,l:i,einheit:"A",tol:2,
    loes:`P<sub>zu</sub> = ${de(p*1000,0)} W / ${de(eta,2)} = ${de(pzu,0)} W · I = P<sub>zu</sub> / (√3 · 400 V · ${de(cos,2)}) = ${de(i,2)} A → Motorschutz auf den Bemessungsstrom einstellen.`};}},
 schleife:{titel:"Schleifenimpedanz",neu(){
   const ch=["B","C"][zufall(0,1)], inn=[10,13,16,20,25][zufall(0,4)], ia=(ch==="B"?5:10)*inn, zs=230/ia;
   return {text:`Endstromkreis 230 V im TN-System mit LS ${ch}${inn}. Für die Abschaltung in 0,4 s gilt I<sub>a</sub> = ${ch==="B"?5:10} · I<sub>n</sub>. Wie groß darf die Schleifenimpedanz Z<sub>S</sub> höchstens sein (in Ω)?`,l:zs,einheit:"Ω",tol:1,
    loes:`I<sub>a</sub> = ${ch==="B"?5:10} · ${inn} A = ${ia} A · Z<sub>S</sub> ≤ U<sub>0</sub> / I<sub>a</sub> = 230 V / ${ia} A = ${de(zs,2)} Ω`};}},
 drehstrom:{titel:"Spannungsfall Drehstrom",neu(){
   const l=zufall(10,60), I=[16,20,25,32][zufall(0,3)], A=[2.5,4,6,10][zufall(0,3)], cos=[1,0.9,0.85][zufall(0,2)];
   const du=Math.sqrt(3)*l*I*cos/(56*A), pz=du/400*100;
   return {text:`Drehstromleitung NYM, Kupfer (γ = 56 m/(Ω·mm²)), l = ${l} m, I = ${I} A, A = ${de(A,1)} mm², cos φ = ${de(cos,2)}. Berechne den Spannungsfall ΔU in V.`,l:du,einheit:"V",tol:2,
    loes:`ΔU = √3 · ${l} m · ${I} A · ${de(cos,2)} / (56 · ${de(A,1)} mm²) = ${de(du,2)} V = ${de(pz,2)} % von 400 V → ${pz<=3?'unter 3 %, in Ordnung':'über 3 % – größeren Querschnitt wählen'}.`};}},
 wp:{titel:"Wärmepumpe",neu(){
   const pth=zufall(4,12,0.5), cop=zufall(2.8,4.6,0.1), pel=Math.round(pth/cop*100)/100, eps=pth/pel;
   return {text:`Eine Wärmepumpe gibt ${de(pth,1)} kW Wärme ab und nimmt dabei ${de(pel,2)} kW elektrische Leistung auf. Berechne die Leistungszahl ε.`,l:eps,einheit:"",tol:1,
    loes:`ε = P<sub>th</sub> / P<sub>el</sub> = ${de(pth,1)} kW / ${de(pel,2)} kW = ${de(eps,2)} – aus 1 kWh Strom werden ${de(eps,1)} kWh Wärme.`};}},
 led:{titel:"LED mit Vorwiderstand",neu(){
   const ub=[5,9,12,24][zufall(0,3)], led=[["rot",2.0],["gelb",2.1],["grün",2.2],["blau",3.0],["weiß",3.2]][zufall(0,4)], i=[10,15,20][zufall(0,2)];
   const r=(ub-led[1])/(i/1000);
   return {text:`Eine ${led[0]}e LED (U<sub>F</sub> = ${de(led[1],1)} V, I<sub>F</sub> = ${i} mA) soll an U<sub>B</sub> = ${ub} V betrieben werden. Berechne den Vorwiderstand R<sub>V</sub> in Ω.`,
    l:r,einheit:"Ω",tol:1,loes:`R<sub>V</sub> = (${ub} V − ${de(led[1],1)} V) / ${de(i/1000,3)} A = ${de(r,1)} Ω → nächster E12-Wert: ${e12(r)} Ω. Leistung: P = ${de(ub-led[1],1)} V · ${de(i/1000,3)} A = ${de((ub-led[1])*i/1000,3)} W`,
    bild:ledSVG(ub)};}},
 span:{titel:"Spannungsfall auf der Sirenenleitung",neu(){
   const l=zufall(8,40), I=zufall(0.2,0.9,0.05), d=[0.6,0.8][zufall(0,1)], A=Math.PI/4*d*d;
   const du=2*l*I/(56*A);
   return {text:`Leitung J-Y(St)Y, Aderdurchmesser ${de(d,1)} mm (A = ${de(A,2)} mm²), Länge ${l} m, Strom der Sirene ${de(I,2)} A, Kupfer γ = 56 m/(Ω·mm²). Berechne den Spannungsfall ΔU in V.`,
    l:du,einheit:"V",tol:2,loes:`ΔU = 2 · ${l} m · ${de(I,2)} A / (56 · ${de(A,2)} mm²) = ${de(du,3)} V. Bei 12 V sind 3 % = 0,36 V erlaubt → ${du<=0.36?'zulässig':'zu groß – Adern parallel schalten'}.`};}},
 energie:{titel:"Zwei Geräte vergleichen",neu(){
   const p1=zufall(40,60), p2=zufall(5,9), h=zufall(2,6), preis=[0.32,0.34,0.36,0.38][zufall(0,3)];
   const diff=(p1-p2)/1000*h*365*preis;
   return {text:`Halogenlampe ${p1} W oder LED-Lampe ${p2} W, beide ${h} h pro Tag an 365 Tagen, Strompreis ${de(preis,2)} €/kWh. Wie viel Euro spart die LED-Lampe pro Jahr?`,
    l:diff,einheit:"€",tol:1.5,loes:`W<sub>1</sub> = ${de(p1/1000,3)} kW · ${h} h · 365 = ${de(p1/1000*h*365,2)} kWh · W<sub>2</sub> = ${de(p2/1000*h*365,2)} kWh · Ersparnis = (${de(p1/1000*h*365,2)} − ${de(p2/1000*h*365,2)}) kWh · ${de(preis,2)} €/kWh = ${de(diff,2)} €`};}},
 zf:{titel:"Sat-ZF berechnen",neu(){
   const f=zufall(10750,12700,1);
   const high=f>=11700, zf=f-(high?10600:9750);
   return {text:`Ein Transponder sendet auf ${de(f,0)} MHz. Berechne die Sat-ZF in MHz.`,l:zf,einheit:"MHz",tol:0,
    loes:`${high?'High':'Low'}-Band (${high?'≥':'<'} 11 700 MHz) → f<sub>LO</sub> = ${high?'10 600':'9750'} MHz · f<sub>ZF</sub> = ${de(f,0)} − ${high?'10 600':'9750'} = ${de(zf,0)} MHz`};}},
 transistor:{titel:"Transistor als Schalter",neu(){
   const ic=zufall(50,300,10), B=[100,150,200,250][zufall(0,3)], ib=ic/B;
   return {text:`Ein NPN-Transistor schaltet ein Relais mit I<sub>C</sub> = ${ic} mA. Die Stromverstärkung ist B = ${B}. Berechne den Basisstrom I<sub>B</sub> in mA (ohne Übersteuerung).`,l:ib,einheit:"mA",tol:2,
    loes:`I<sub>B</sub> = I<sub>C</sub> / B = ${ic} mA / ${B} = ${de(ib,3)} mA`};}}
};
const E12=[1,1.2,1.5,1.8,2.2,2.7,3.3,3.9,4.7,5.6,6.8,8.2];
function e12(r){let dek=Math.pow(10,Math.floor(Math.log10(r)));for(const w of E12){if(w*dek>=r-1e-9)return de(w*dek,0);}return de(10*dek,0);}
function ledSVG(ub){return `<svg viewBox="0 0 330 130" width="330" height="130" aria-label="Schaltung LED mit Vorwiderstand">
 <g stroke="#000" stroke-width="2" fill="none">
  <path d="M40 30 H120 M170 30 H230 M230 30 V60 M230 100 V110 H40 V95 M40 65 V30"/>
  <circle cx="40" cy="80" r="15"/><path d="M40 65 V95"/>
  <rect x="120" y="22" width="50" height="16"/>
  <path d="M218 60 H242 L230 82 Z M218 82 H242 M230 82 V100" fill="#fff"/>
  <path d="M246 66 L262 56 M252 75 L268 65"/><path d="M262 56 l-6 0 M262 56 l-2 5 M268 65 l-6 0 M268 65 l-2 5"/>
 </g>
 <g font-size="12"><text x="2" y="84">U<tspan font-size="9" dy="3">B</tspan></text><text x="2" y="100" font-size="11">${ub} V</text>
 <text x="133" y="16">R<tspan font-size="9" dy="3">V</tspan></text><text x="250" y="96">LED</text></g></svg>`;}
let T=null;
function seiteTrainer(art){
 $("#app").innerHTML=`<div class="karte"><h2>Rechentrainer</h2>
  <p>Jede Aufgabe bekommt neue Zahlen. Schaffst du <b>3 richtige hintereinander</b>, gilt der Trainer als bestanden.</p>
  <div class="tabs">${Object.entries(TRAINER).map(([k,v])=>`<button class="${k===(art||'motor')?'aktiv':''}" onclick="seiteTrainer('${k}')">${v.titel}${(stand.trainer[k]||0)>=3?' ✓':''}</button>`).join("")}</div>
  <div id="tr"></div></div>`;
 trainerNeu(art||"motor");
}
function trainerNeu(art){
 T={art,a:TRAINER[art].neu()};
 $("#tr").innerHTML=`${T.a.bild||''}<p class="frage">${T.a.text}</p>
  <input type="text" inputmode="decimal" autocomplete="off" id="treing" placeholder="Ergebnis"> ${T.a.einheit}
  <p><button class="btn" onclick="trainerPruefen()">Prüfen</button>
  <button class="btn zweit" onclick="trainerNeu('${art}')">Neue Zahlen</button></p><div id="trfb"></div>
  <p class="klein">Serie: ${stand.trainer[art]||0} richtig hintereinander</p>`;
}
function trainerPruefen(){
 const v=zahl($("#treing").value); if(isNaN(v))return;
 const ok=T.a.tol===0?Math.round(v)===Math.round(T.a.l):Math.abs(v-T.a.l)<=Math.abs(T.a.l)*T.a.tol/100;
 stand.trainer[T.art]=ok?(stand.trainer[T.art]||0)+1:0; sichern();
 $("#trfb").innerHTML=`<div class="feedback ${ok?'ok':'nein'}"><b>${ok?'Richtig!':'Noch nicht.'}</b> ${T.a.loes}</div>
  <button class="btn" onclick="seiteTrainer('${T.art}')">Nächste Aufgabe →</button>`;
}

/* ---------- Prüfungsmix ---------- */
function seiteMix(){
 $("#app").innerHTML=`<div class="karte"><h2>Prüfungsmix</h2>
  <p>15 zufällige Fragen aus allen Bereichen – wie in der Gesellenprüfung. Ziel: mindestens 80 %.</p>
  <p class="klein">Bester Mix bisher: ${stand.quiz.mix!==undefined?stand.quiz.mix+' %':'noch keiner'}</p>
  <div id="mixq"><button class="btn" onclick="mixStart()">Prüfungsmix starten</button></div></div>`;
}
function mixStart(){
 const alle=[].concat(...Object.values(QUIZ));
 quizStart("mix",mischen(alle).slice(0,15),"mixq","mix");
}

/* ---------- 4-Wochen-Plan (Seite) ---------- */
function seitePlan(){
 $("#app").innerHTML=`<div class="karte"><h2>Dein 4-Wochen-Plan bis zur Prüfung</h2>
  <p>Pro Woche ca. 4–5 kurze Einheiten à 20 Minuten. Hake ab, was du geschafft hast.</p>
  <div class="info">📆 Den genauen Termin deiner Gesellenprüfung findest du auf der offiziellen Seite des Landesinnungsverbands: <a href="${PRUEFUNGSTERMINE}" target="_blank" rel="noopener">Prüfungstermine Gesellenprüfung (Elektroverband Bayern)</a></div>
  <table><tr><th style="width:80px">Woche</th><th style="width:150px">Thema</th><th>Das machst du</th><th>Challenge</th><th style="width:70px">erledigt</th></tr>
  ${PLAN.map((w,i)=>`<tr class="woche ${stand.plan[i]?'erledigt':''}"><td>${w[0]}</td><td><b>${w[1]}</b></td><td>${w[2]}</td><td>${sub(w[3])}</td>
   <td style="text-align:center"><input type="checkbox" ${stand.plan[i]?'checked':''} onchange="stand.plan[${i}]=this.checked;sichern();seitePlan()"></td></tr>`).join("")}
  </table>
  <h3>Wiederholungsblätter zum Ausdrucken</h3>
  <p>Bearbeite sie wie eine Prüfung (Tabellenbuch, Formelsammlung, Taschenrechner). Die Lösung besprichst du mit deiner Lehrkraft.</p>
  <ul>${MATERIAL.map(m=>`<li><a href="${m[1]}" target="_blank" rel="noopener">${m[0]} (PDF)</a></li>`).join("")}</ul></div>`;
}

/* ---------- Info ---------- */
function seiteInfo(){
 $("#app").innerHTML=`<div class="karte"><h2>So lernst du mit Prüfungsfit</h2>
  <ol>
   <li><b>Karteikarten:</b> Frage lesen, Antwort laut sagen, Karte umdrehen. „Gewusst“ schiebt die Karte ein Fach weiter, „Nochmal“ zurück in Fach 1.</li>
   <li><b>Quiz:</b> Pro Bereich 10–14 Fragen (Auswahl, Rechnen, Zuordnen) in zufälliger Reihenfolge. Am Ende siehst du, ob du beim Nennen, Erklären oder Berechnen noch Lücken hast. Ab 80 % ist der Bereich auf der Lernlandkarte grün.</li>
   <li><b>Rechentrainer:</b> Immer neue Zahlen – rechne auf Papier mit Formel, Einsetzen und Einheit wie in der Prüfung.</li>
   <li><b>Prüfungsmix:</b> In der letzten Woche mehrmals durchführen.</li>
   <li><b>Fehlersuche:</b> Störungsfälle wie im Kundendienst – erst überlegen, dann Karte umdrehen.</li>
   <li><b>Challenge:</b> Jede Woche eine kleine Aufgabe für Betrieb oder Zuhause. Hake die Woche im Plan ab, dann kommt die nächste.</li>
  </ol>
  <div class="hinweis">Dein Fortschritt wird nur auf diesem Gerät im Browser gespeichert. Es werden keine Namen oder persönlichen Daten erfasst. Hilfsmittel wie in der Prüfung: Tabellenbuch, Formelsammlung, Taschenrechner.</div>
  <div class="info" style="margin-top:10px">📆 Offizielle Prüfungstermine: <a href="${PRUEFUNGSTERMINE}" target="_blank" rel="noopener">Termine Gesellenprüfung – Elektroverband Bayern</a></div>
  <p><button class="btn zweit" onclick="if(confirm('Wirklich alles zurücksetzen?')){stand={quiz:{},fach:{},plan:{},trainer:{}};sichern();zeige('start')}">Fortschritt zurücksetzen</button></p>
 </div>`;
}

document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;
 if(e.target.id==="eing"){quizPruefen();}
 else if(e.target.id==="treing"){trainerPruefen();}});
zeige("start");
</script>
